name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Windows Qt SDK
        if: runner.os == 'Windows'
        timeout-minutes: 15
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          modules: qtmultimedia
          cache: true
          setup-python: false
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          mirror=
          probe=$(mktemp)
          trap 'rm -f "$probe"' EXIT
          for candidate in https://archive.ubuntu.com/ubuntu/ https://mirrors.mit.edu/ubuntu/; do
            verified=true
            for pocket in noble noble-updates noble-backports noble-security; do
              if ! curl --fail --silent --show-error --location --proto '=https' \
                        --proto-redir '=https' --connect-timeout 3 --max-time 10 \
                        --output "$probe" "${candidate}dists/${pocket}/InRelease" ||
                 ! gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$probe"; then
                verified=false
                break
              fi
            done
            if [ "$verified" = true ]; then
              mirror=$candidate
              break
            fi
          done
          if [ -z "$mirror" ]; then
            echo '::error::No reachable signed Ubuntu archive mirror'
            exit 1
          fi
          echo "Using Ubuntu archive mirror: $mirror"
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
                        /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i \
                -e "s#https\?://\(azure\.archive\|archive\|security\)\.ubuntu\.com/ubuntu/#$mirror#g" \
                -e "s#mirror+file:/etc/apt/apt-mirrors\.txt#$mirror#g" \
                "$source"
            fi
          done
          apt_state=$(mktemp -d /tmp/cupidgb-apt.XXXXXX)
          chmod 755 "$apt_state"
          mkdir -p "$apt_state/lists/partial"
          sudo chown _apt:root "$apt_state/lists/partial"
          sudo chmod 700 "$apt_state/lists/partial"
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20
                       -o Acquire::https::Timeout=20 -o Dir::State::lists="$apt_state/lists")
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          native_arch=$(dpkg --print-architecture)
          echo "APT native architecture: $native_arch"
          echo 'APT architecture, index and cache configuration:'
          sudo apt-config "${apt_options[@]}" dump | grep -E \
            '^(APT::Architectures?(::| )|Dir::(State|Cache) |Dir::State::lists |Dir::Cache::(pkgcache|srcpkgcache) |Dir::Etc::(sourcelist|sourceparts) |Binary::(apt-get|apt-cache)::(APT::Architectures?(::| )|Dir::(State|Cache)(::| )))'
          echo 'Active binary package index targets:'
          sudo apt-get "${apt_options[@]}" indextargets \
            --format '$(IDENTIFIER) | $(ARCHITECTURE) | $(COMPONENT) | $(FILENAME)' \
            'Identifier: Packages'
          echo 'APT repository policy:'
          sudo apt-cache "${apt_options[@]}" policy
          echo 'Private index directory permissions:'
          sudo stat -c '%A %U:%G %s %n' "$apt_state" "$apt_state/lists" \
            "$apt_state/lists/partial"
          echo 'Downloaded private index files:'
          sudo find "$apt_state/lists" -maxdepth 1 -type f -printf '%M %u:%g %s %p\n'
          apt_helper=$(dpkg-query -L apt | awk '/\/apt-helper$/ { print; exit }')
          if [ -n "$apt_helper" ] && [ -x "$apt_helper" ]; then
            universe_count=0
            while IFS= read -r -d '' index; do
              echo "Universe package headers from $index:"
              sudo "$apt_helper" cat-file "$index" | awk \
                '/^Package: (qt6-base-dev|qt6-multimedia-dev|libsdl2-dev)$/ { print; count++ }
                 END { printf "Matching Package headers: %d\n", count }'
              universe_count=$((universe_count + 1))
            done < <(sudo find "$apt_state/lists" -maxdepth 1 -type f \
              -name "*_dists_noble_universe_binary-${native_arch}_Packages*" -print0)
            echo "Universe index files inspected: $universe_count"
          else
            echo '::warning::The apt package did not provide an executable apt-helper'
          fi
          echo 'Requested package policy using the normal cache:'
          sudo apt-cache "${apt_options[@]}" policy qt6-base-dev qt6-multimedia-dev libsdl2-dev
          echo 'Requested package policy without reusable binary caches:'
          sudo apt-cache "${apt_options[@]}" -o Dir::Cache::pkgcache= \
            -o Dir::Cache::srcpkgcache= policy qt6-base-dev qt6-multimedia-dev libsdl2-dev
          sudo apt-get "${apt_options[@]}" install -y qt6-base-dev qt6-multimedia-dev libssl-dev libsdl2-dev 7zip
      - name: Windows controller SDK
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'SDL2-devel-2.28.5-VC.zip'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-devel-2.28.5-VC.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '4AC4BA2208410B7B984759EE12E13E0606BD62032B5DDC36FB7D96B9ADE78871') {
            throw 'Controller SDK checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          "SDL2_ROOT=$env:RUNNER_TEMP/SDL2-2.28.5" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        env:
          CUPIDGB_REQUIRE_ARCHIVE_TESTS: '1'
        run: ctest --test-dir build -C Release --output-on-failure
  sanitized-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Hashing dependency
        timeout-minutes: 10
        run: |
          mirror=
          probe=$(mktemp)
          trap 'rm -f "$probe"' EXIT
          for candidate in https://archive.ubuntu.com/ubuntu/ https://mirrors.mit.edu/ubuntu/; do
            verified=true
            for pocket in noble noble-updates noble-backports noble-security; do
              if ! curl --fail --silent --show-error --location --proto '=https' \
                        --proto-redir '=https' --connect-timeout 3 --max-time 10 \
                        --output "$probe" "${candidate}dists/${pocket}/InRelease" ||
                 ! gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$probe"; then
                verified=false
                break
              fi
            done
            if [ "$verified" = true ]; then
              mirror=$candidate
              break
            fi
          done
          if [ -z "$mirror" ]; then
            echo '::error::No reachable signed Ubuntu archive mirror'
            exit 1
          fi
          echo "Using Ubuntu archive mirror: $mirror"
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
                        /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i \
                -e "s#https\?://\(azure\.archive\|archive\|security\)\.ubuntu\.com/ubuntu/#$mirror#g" \
                -e "s#mirror+file:/etc/apt/apt-mirrors\.txt#$mirror#g" \
                "$source"
            fi
          done
          apt_state=$(mktemp -d /tmp/cupidgb-apt.XXXXXX)
          chmod 755 "$apt_state"
          mkdir -p "$apt_state/lists/partial"
          sudo chown _apt:root "$apt_state/lists/partial"
          sudo chmod 700 "$apt_state/lists/partial"
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20
                       -o Acquire::https::Timeout=20 -o Dir::State::lists="$apt_state/lists")
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          native_arch=$(dpkg --print-architecture)
          echo "APT native architecture: $native_arch"
          echo 'APT architecture, index and cache configuration:'
          sudo apt-config "${apt_options[@]}" dump | grep -E \
            '^(APT::Architectures?(::| )|Dir::(State|Cache) |Dir::State::lists |Dir::Cache::(pkgcache|srcpkgcache) |Dir::Etc::(sourcelist|sourceparts) |Binary::(apt-get|apt-cache)::(APT::Architectures?(::| )|Dir::(State|Cache)(::| )))'
          echo 'Active binary package index targets:'
          sudo apt-get "${apt_options[@]}" indextargets \
            --format '$(IDENTIFIER) | $(ARCHITECTURE) | $(COMPONENT) | $(FILENAME)' \
            'Identifier: Packages'
          echo 'APT repository policy:'
          sudo apt-cache "${apt_options[@]}" policy
          echo 'Private index directory permissions:'
          sudo stat -c '%A %U:%G %s %n' "$apt_state" "$apt_state/lists" \
            "$apt_state/lists/partial"
          echo 'Downloaded private index files:'
          sudo find "$apt_state/lists" -maxdepth 1 -type f -printf '%M %u:%g %s %p\n'
          apt_helper=$(dpkg-query -L apt | awk '/\/apt-helper$/ { print; exit }')
          if [ -n "$apt_helper" ] && [ -x "$apt_helper" ]; then
            universe_count=0
            while IFS= read -r -d '' index; do
              echo "Universe package headers from $index:"
              sudo "$apt_helper" cat-file "$index" | awk \
                '/^Package: (qt6-base-dev|qt6-multimedia-dev|libsdl2-dev)$/ { print; count++ }
                 END { printf "Matching Package headers: %d\n", count }'
              universe_count=$((universe_count + 1))
            done < <(sudo find "$apt_state/lists" -maxdepth 1 -type f \
              -name "*_dists_noble_universe_binary-${native_arch}_Packages*" -print0)
            echo "Universe index files inspected: $universe_count"
          else
            echo '::warning::The apt package did not provide an executable apt-helper'
          fi
          echo 'Requested package policy using the normal cache:'
          sudo apt-cache "${apt_options[@]}" policy libssl-dev
          echo 'Requested package policy without reusable binary caches:'
          sudo apt-cache "${apt_options[@]}" -o Dir::Cache::pkgcache= \
            -o Dir::Cache::srcpkgcache= policy libssl-dev
          sudo apt-get "${apt_options[@]}" install -y libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCUPIDGB_BUILD_QT=OFF -DCUPIDGB_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure portable hashing
        run: cmake -S . -B build-portable -DCMAKE_BUILD_TYPE=Debug -DCUPIDGB_BUILD_QT=OFF -DCUPIDGB_ENABLE_SANITIZERS=ON -DCUPIDGB_ENABLE_NATIVE_HASH=OFF
      - name: Build portable snapshot checks
        run: cmake --build build-portable --target cupidgb_state cupidgb_sha256 cupidgb_core_interop --parallel 4
      - name: Test portable snapshot checks
        run: ctest --test-dir build-portable --output-on-failure -R "cupidgb_(state|sha256|core_interop)$"
